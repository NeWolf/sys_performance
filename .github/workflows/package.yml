name: Package Windows Linux and macOS

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.platform }} ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows
            arch: x64
          - os: ubuntu-22.04
            platform: linux
            arch: x64
          - os: macos-15
            platform: macos
            arch: arm64
          - os: macos-15-intel
            platform: macos
            arch: x64
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      BUILD_OUTPUT: ${{ github.workspace }}/.ci-build
      PUBLISH_OUTPUT: ${{ github.workspace }}/ci-artifacts

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: ${{ matrix.arch }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          architecture: ${{ matrix.arch }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Select official Node distribution for redistribution
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import shutil
          import sys
          sys.path.insert(0, "packaging")
          import platform
          from node_runtime import official_node_files
          node = Path(shutil.which("node")).resolve()
          cache = Path(os.environ["RUNNER_TOOL_CACHE"]).resolve()
          if not node.is_relative_to(cache):
              raise RuntimeError("Expected official actions/setup-node tool-cache runtime")
          root = node.parent if os.name == "nt" else node.parent.parent
          official_node_files(root, platform.system())
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(f"JDPERF_NODE_DIST_DIR={root}\n")
          PY

      - name: Set macOS deployment baseline
        if: runner.os == 'macOS'
        run: python -c 'import sys; sys.path.insert(0, "packaging"); from macos_compat import MACOS_MIN_VERSION; print("MACOSX_DEPLOYMENT_TARGET=" + MACOS_MIN_VERSION)' >> "$GITHUB_ENV"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt 'pyinstaller>=6.11,<7' 'Pillow>=10.4,<12'

      - name: Build and lint frontend
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build
          npm --prefix frontend run lint

      - name: Run backend regression tests
        run: python -m unittest test_perf test_adb test_packaging test_joyspace test_admission test_admission_jobs test_admission_api

      - name: Locate Windows installer compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) {
            throw 'Inno Setup 6 is missing from the Windows runner'
          }
          Split-Path $compiler | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Check Linux installer tools
        if: runner.os == 'Linux'
        run: |
          command -v dpkg-deb
          test "$(dpkg --print-architecture)" = amd64

      - name: Check macOS packaging tools and architecture
        if: runner.os == 'macOS'
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          command -v hdiutil
          command -v lipo
          command -v otool
          python -c 'import os, platform; expected = {"arm64": "arm64", "x64": "x86_64"}[os.environ["EXPECTED_ARCH"]]; assert platform.machine() == expected, platform.machine()'

      - name: Build native packages
        run: python packaging/build.py --skip-frontend --output-dir "$BUILD_OUTPUT"

      - name: Verify checksums and smoke-test extracted application
        run: python packaging/verify_build.py --output-dir "$BUILD_OUTPUT" --publish-dir "$PUBLISH_OUTPUT"

      - name: Upload verified packages
        uses: actions/upload-artifact@v4
        with:
          name: JDPerf-${{ matrix.platform }}-${{ matrix.arch }}-${{ github.run_number }}
          path: ${{ env.PUBLISH_OUTPUT }}/*
          if-no-files-found: error
          retention-days: 30